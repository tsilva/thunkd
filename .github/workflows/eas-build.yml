name: Preview Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo token
        id: expo-token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping preview build because the EXPO_TOKEN Actions secret is not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.expo-token.outputs.available == 'true'

      - uses: actions/setup-node@v4
        if: steps.expo-token.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.expo-token.outputs.available == 'true'

      - uses: expo/expo-github-action@v8
        if: steps.expo-token.outputs.available == 'true'
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - run: eas build --platform android --profile preview --non-interactive --no-wait
        if: steps.expo-token.outputs.available == 'true'

      # Uncomment the steps below once a Play Store service account key
      # is stored as the PLAY_STORE_SERVICE_ACCOUNT_KEY GitHub secret.
