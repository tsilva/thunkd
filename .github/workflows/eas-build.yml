name: Preview Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check Expo token
        id: expo-token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping preview build because the EXPO_TOKEN Actions secret is not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.expo-token.outputs.available == 'true'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.expo-token.outputs.available == 'true'
        with:
          version: 10.27.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.expo-token.outputs.available == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.expo-token.outputs.available == 'true'

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        if: steps.expo-token.outputs.available == 'true'
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - run: eas build --platform android --profile preview --non-interactive --no-wait
        if: steps.expo-token.outputs.available == 'true'

      # Uncomment the steps below once a Play Store service account key
      # is stored as the PLAY_STORE_SERVICE_ACCOUNT_KEY GitHub secret.
